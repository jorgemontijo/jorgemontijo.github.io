<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jorge's Age in Days</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #f0f0f0;
  }
  .card {
    text-align: center;
    padding: 2.5rem 3rem;
    border-radius: 16px;
    background: trasparent;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .label {
    font-size: 1rem;
    color: #9aa5c7;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .days {
    font-size: 4rem;
    font-weight: 700;
    color: #e94560;
    line-height: 1;
    margin: 0.25rem 0;
  }
  .sub {
    font-size: 1rem;
    color: #9aa5c7;
    margin-top: 0.75rem;
  }
  .date {
    font-size: 0.85rem;
    color: #5c6690;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label">Jorge's Age</div>
    <div class="days" id="dayCount">–</div>
    <div class="sub" id="yearsSub">days old</div>
    <div class="date" id="today"></div>
  </div>

  <script>
    const birthDate = new Date(1974, 1, 16); // Feb 16, 1974 (month is 0-indexed), local midnight

    function updateAge() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const msPerDay = 1000 * 60 * 60 * 24;
      const diffDays = Math.round((today - birthDate) / msPerDay);

      // years/months/days breakdown
      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();
      if (days < 0) {
        months -= 1;
        const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }

      document.getElementById('dayCount').textContent = diffDays.toLocaleString();
      document.getElementById('yearsSub').textContent =
        `days old (${years} years, ${months} months, ${days} days)`;
      document.getElementById('today').textContent =
        'As of ' + today.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    updateAge();
    // Recheck every minute in case the page stays open across midnight
    setInterval(updateAge, 60000);
  </script>
</body>
</html>
