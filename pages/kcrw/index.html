<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>89.9 FM Community Radio • Los Angeles</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #141719;
    --amber: #f2a33b;
    --red: #e65440;
    --yellow: #ffe894;
    --gray: #8e8e93;
    --inset: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .radio { width: 100%; max-width: 520px; padding: 24px; display: flex; flex-direction: column; gap: 32px; }

  /* ---------- Banner ---------- */
  .banner { display: flex; justify-content: space-between; align-items: baseline; }
  .banner h1 { margin: 0; font-size: 40px; font-weight: 700; }
  .banner .freq { color: var(--amber); font-size: 12px; }

  /* ---------- Dial ---------- */
  .dial { padding: 8px 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .dial::before, .dial::after {
    content: ""; position: absolute; left: 0; right: 0; height: 1px;
    background: rgba(255,255,255,.12);
    transition: background .4s ease, box-shadow .4s ease;
  }
  .dial::before { top: 0; }
  .dial::after { bottom: 0; }
  .dial.live::before, .dial.live::after {
    background: var(--yellow);
    box-shadow: 0 0 6px rgba(255,232,148,.7);
  }
  .labels { position: relative; height: 14px; font-size: 10px; }
  .labels span {
    position: absolute; top: 0; transform: translateX(-50%);
    color: var(--gray); transition: color .4s ease, text-shadow .4s ease;
  }
  .labels span.station { color: var(--amber); }
  .dial.live .labels span:not(.station) { color: var(--yellow); text-shadow: 0 0 8px rgba(255,232,148,.6); }

  .scale { position: relative; height: 44px; }
  .scale .tick {
    position: absolute; bottom: 0; width: 1px; background: var(--gray);
    transform: translateX(-50%);
  }
  .scale .tick.lit {
    background: var(--yellow); opacity: 0;
    box-shadow: 0 0 4px rgba(255,232,148,.8);
    transition: opacity .4s ease;
  }
  .dial.live .scale .tick.lit { opacity: 1; }
  .needle {
    position: absolute; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
    background: var(--red); opacity: .35;
    transition: opacity .4s ease, box-shadow .4s ease;
  }
  .dial.live .needle { opacity: 1; box-shadow: 0 0 6px var(--red); }

  /* ---------- Channel buttons ---------- */
  .channels { display: flex; gap: 12px; }
  .channel {
    flex: 1; text-align: left; cursor: pointer;
    padding: 16px; border-radius: 10px;
    background: rgba(255,255,255,.06); color: #fff;
    border: 1px solid rgba(255,255,255,.3);
    font: inherit; outline: none;
    display: flex; flex-direction: column; gap: 6px;
  }
  .channel .name { font-size: 17px; font-weight: 600; }
  .channel .state { font-size: 12px; min-height: 1.2em; }
  .channel.on { background: var(--amber); color: #000; }
  .message { font-size: 12px; color: var(--red); min-height: 1.2em; }
 }
</style>
</head>
<body>
<main class="radio">
  <section class="banner">
    <h1>89.9 FM</h1>
    <span class="freq mono">LOS ANGELES</span>
  </section>

  <section class="dial" id="dial">
    <div class="labels mono" id="labels"></div>
    <div class="scale" id="scale"><div class="needle" id="needle"></div></div>
  </section>

  <section class="channels" id="channels"></section>

  <div class="message mono" id="message">&nbsp;</div>
</main>

<audio id="audio" preload="none"></audio>

<script>
(() => {
  const LOW = 88, HIGH = 92, STATION = 89.9, INSET = 14;

  const CHANNELS = [
    { id: "onAir", title: "On Air",
      pls: "https://media.kcrw.com/pls/kcrwsimulcast.pls",
      fallback: "https://streams.kcrw.com/kcrw_aac" },
    { id: "e24", title: "Eclectic 24",
      pls: "https://media.kcrw.com/pls/kcrwmusic.pls",
      fallback: "https://streams.kcrw.com/e24_aac" },
  ];

  const $ = id => document.getElementById(id);
  const audio = $("audio");
  const dial = $("dial");

  const dialLeft = f => `calc(${INSET}px + ${(f - LOW) / (HIGH - LOW)} * (100% - ${INSET * 2}px))`;

  // ---------- Dial ----------
  [["88", 88], ["89", 89], ["89.9", 89.9], ["91", 91], ["92", 92]].forEach(([text, f]) => {
    const s = document.createElement("span");
    s.textContent = text;
    s.style.left = dialLeft(f);
    if (f === STATION) s.className = "station";
    $("labels").appendChild(s);
  });

  const scale = $("scale");
  for (let i = 0; i <= 40; i++) {
    const f = LOW + i * 0.1;
    const h = i % 10 === 0 ? 24 : (i % 5 === 0 ? 16 : 9);
    for (const lit of [false, true]) {
      const t = document.createElement("div");
      t.className = "tick" + (lit ? " lit" : "");
      t.style.left = dialLeft(f);
      t.style.height = h + "px";
      scale.appendChild(t);
    }
  }
  $("needle").style.left = dialLeft(STATION);

  // ---------- Player ----------
  let current = null;
  let status = "";
  let token = 0;

  const buttons = {};
  CHANNELS.forEach(ch => {
    const b = document.createElement("button");
    b.className = "channel";
    b.innerHTML = `<span class="name">${ch.title}</span><span class="state mono">&nbsp;</span>`;
    b.addEventListener("click", () => toggle(ch));
    $("channels").appendChild(b);
    buttons[ch.id] = b;
  });

  function render() {
    CHANNELS.forEach(ch => {
      const on = current === ch;
      buttons[ch.id].classList.toggle("on", on);
      buttons[ch.id].querySelector(".state").textContent = on ? status : "\u00a0";
    });
    dial.classList.toggle("live", status === "Live");
    $("message").textContent = current ? "\u00a0" : (status || "\u00a0");
  }

  function setStatus(s) { status = s; render(); }

  function toggle(ch) { current === ch ? stop() : play(ch); }

  function stop(message = "") {
    token++;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    current = null;
    status = message;
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.playbackState = "none";
    }
    render();
  }

  async function resolve(ch) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 3000);
      const res = await fetch(ch.pls, { signal: ctl.signal });
      clearTimeout(timer);
      const text = await res.text();
      for (const line of text.split(/\r?\n/)) {
        const t = line.trim();
        if (t.toLowerCase().startsWith("file1=")) {
          const url = t.slice(6);
          if (url.startsWith("https://")) return url;
        }
      }
    } catch (_) { /* blocked by CORS or offline: use the direct stream */ }
    return ch.fallback;
  }

  async function play(ch) {
    stop();
    current = ch;
    setStatus("Connecting");
    const mine = token;

    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "KCRW " + ch.title, artist: "KCRW 89.9 FM"
      });
      navigator.mediaSession.playbackState = "playing";
    }

    const url = await resolve(ch);
    if (mine !== token) return;
    start(url, url === ch.fallback ? null : ch.fallback, ch, mine);
  }

  function start(url, fallback, ch, mine) {
    if (mine !== token) return;
    audio.src = url;
    audio.play().catch(err => {
      if (mine !== token || err.name === "AbortError") return;
      failed(fallback, ch, mine);
    });
  }

  function failed(fallback, ch, mine) {
    if (mine !== token) return;
    if (fallback) start(fallback, null, ch, mine);
    else stop("Could not play " + ch.title);
  }

  audio.addEventListener("playing", () => { if (current) setStatus("Live"); });
  audio.addEventListener("waiting", () => { if (current) setStatus("Buffering"); });
  audio.addEventListener("stalled", () => { if (current) setStatus("Buffering"); });
  audio.addEventListener("error", () => {
    if (!current || !audio.getAttribute("src")) return;
    const ch = current;
    const fallback = audio.src === ch.fallback ? null : ch.fallback;
    failed(fallback, ch, token);
  });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("pause", () => stop());
    navigator.mediaSession.setActionHandler("stop", () => stop());
  }

  render();
})();
</script>
</body>
</html>
