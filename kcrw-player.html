<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCRW On Air</title>
<style>
  /* Layout: single column radio face — frequency dial on top, now-playing, transport. */
  :root{
    --bg:#14171a; --panel:#1c2024; --ink:#ece8df; --dim:#8b9199;
    --amber:#f2a33a; --live:#e5533d; --line:#2c3238;
    --display: "Avenir Next Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
    --body: "Avenir Next","Helvetica Neue",Arial,sans-serif;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);display:grid;place-items:center;padding:16px}
  main{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:22px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h1{margin:0;font-family:var(--display);font-weight:700;font-size:2.2rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .freq{font-family:var(--mono);color:var(--amber);font-size:.95rem;letter-spacing:.06em}
  .dial{position:relative;height:58px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:repeating-linear-gradient(90deg,var(--dim) 0 1px,transparent 1px 14px) bottom/100% 10px no-repeat,
               repeating-linear-gradient(90deg,var(--dim) 0 1px,transparent 1px 70px) bottom/100% 22px no-repeat}
  .dial span{position:absolute;top:6px;font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .needle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--live);box-shadow:0 0 10px var(--live);opacity:.35;transition:opacity .4s}
  body.playing .needle{opacity:1}
  .np{display:grid;gap:6px;min-height:84px;align-content:start}
  .badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  body.playing .dot{background:var(--live);animation:pulse 1.4s infinite}
  body.buffering .dot{background:var(--amber)}
  @keyframes pulse{50%{opacity:.35}}
  #title{font-family:var(--display);font-size:1.6rem;line-height:1.15;overflow-wrap:anywhere}
  #artist{color:var(--dim);overflow-wrap:anywhere}
  .controls{display:flex;align-items:center;gap:16px}
  #play{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--amber);color:#1a1205;cursor:pointer;display:grid;place-items:center}
  #play:hover{filter:brightness(1.08)}
  #play:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  #play svg{width:28px;height:28px;fill:currentColor}
  .vol{flex:1;display:grid;gap:4px;min-width:0}
  .vol label{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  input[type=range]{width:100%;accent-color:var(--amber)}
  .tune{display:grid;gap:6px}
  .tune label{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .tune select,.tune input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;font-size:.9rem}
  footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
  #status{min-width:0;overflow-wrap:anywhere}
  .err{color:var(--live)}
  @media (prefers-reduced-motion:reduce){.dot{animation:none!important}}
</style>
</head>
<body>
<main>
  <header><h1>KCRW</h1><span class="freq">89.9 FM · LOS ANGELES</span></header>

  <div class="dial" aria-hidden="true">
    <span style="left:4%">88</span><span style="left:30%">89</span><span style="left:50%;color:var(--amber)">89.9</span><span style="left:74%">91</span><span style="left:92%">92</span>
    <div class="needle"></div>
  </div>

  <section class="np" aria-live="polite">
    <div class="badge"><i class="dot"></i><span id="state">Stopped</span></div>
    <div id="title">On Air</div>
    <div id="artist">Press play to tune in</div>
  </section>

  <div class="controls">
    <button id="play" aria-label="Play" title="Play / pause (space)">
      <svg viewBox="0 0 24 24" id="icon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="vol"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></div>
  </div>

  <div class="tune">
    <label for="chan">Channel</label>
    <select id="chan"><option value="onair">On Air (simulcast)</option><option value="e24">Eclectic 24</option></select>
    <label for="custom">Custom stream URL (optional)</label>
    <input id="custom" type="url" placeholder="https://…">
  </div>

  <footer><span id="status">Source: —</span><a style="color:inherit" href="https://www.kcrw.com/music/shows" target="_blank" rel="noopener">kcrw.com</a></footer>
</main>

<audio id="audio" preload="none"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
  // Source order: HLS AAC 256 kbps, then direct MP3 192 kbps.
  // On Air AAC confirmed working in Safari and Chrome. The HLS entries are fallbacks if that URL changes.
  var CHANNELS = {
    onair: [
      {label:"On Air AAC", url:"https://streams.kcrw.com/kcrw_aac", hls:false},
      {label:"On Air HLS 256 (native)", url:"https://streams.kcrw.com/4651_256.aac/playlist.m3u8", hls:false},
      {label:"On Air HLS 256 (hls.js)", url:"https://streams.kcrw.com/4651_256.aac/playlist.m3u8", hls:true}
    ],
    e24: [
      {label:"Eclectic 24 AAC", url:"https://streams.kcrw.com/e24_aac", hls:false},
      {label:"Eclectic 24 MP3", url:"https://streams.kcrw.com/e24_mp3", hls:false}
    ]
  };
  var SOURCES = CHANNELS.onair;
  var chanEl=document.getElementById("chan"), customEl=document.getElementById("custom");
  function pickSources(){
    var u=customEl.value.trim();
    SOURCES = u ? [{label:"Custom (native)", url:u, hls:false}].concat(/\.m3u8(\?|$)/i.test(u) ? [{label:"Custom (hls.js)", url:u, hls:true}] : []) : CHANNELS[chanEl.value];
  }
  var NP_URLS = ["https://tracklist-api.kcrw.com/Simulcast/all/1","http://tracklist-api.kcrw.com/Simulcast/all/1"];

  var audio=document.getElementById("audio"), btn=document.getElementById("play"), icon=document.getElementById("icon"),
      stateEl=document.getElementById("state"), statusEl=document.getElementById("status"),
      titleEl=document.getElementById("title"), artistEl=document.getElementById("artist"), vol=document.getElementById("vol");
  var hls=null, idx=0, wantPlay=false, npTimer=null;
  var PLAY="M8 5v14l11-7z", PAUSE="M6 5h4v14H6zm8 0h4v14h-4z";

  function setState(s,cls){
    stateEl.textContent=s;
    document.body.classList.toggle("playing",cls==="playing");
    document.body.classList.toggle("buffering",cls==="buffering");
  }
  function setIcon(p){ icon.firstElementChild.setAttribute("d",p?PAUSE:PLAY); btn.setAttribute("aria-label",p?"Pause":"Play"); }
  function teardown(){ if(hls){hls.destroy();hls=null;} audio.removeAttribute("src"); audio.load(); }

  function load(i){
    idx=i; var s=SOURCES[i]; teardown();
    statusEl.classList.remove("err"); statusEl.textContent="Source: "+s.label;
    setState("Connecting","buffering");
    if(s.hls){
      if(window.Hls && Hls.isSupported()){
        hls=new Hls({lowLatencyMode:false});
        hls.on(Hls.Events.ERROR,function(_,d){ if(d.fatal) fail("HLS error: "+d.details); });
        hls.loadSource(s.url); hls.attachMedia(audio);
      } else return fail("HLS unsupported in this browser");
    } else { audio.src=s.url; }
    audio.play().catch(function(e){ if(e&&e.name!=="AbortError") fail(e.message||"Playback blocked"); });
  }
  function fail(msg){
    if(!wantPlay) return;
    if(idx<SOURCES.length-1){ statusEl.textContent=msg+" — trying "+SOURCES[idx+1].label; return load(idx+1); }
    wantPlay=false; teardown(); setIcon(false); setState("Stopped","");
    statusEl.classList.add("err"); statusEl.textContent="Could not connect: "+msg;
  }
  function start(){ pickSources(); wantPlay=true; setIcon(true); load(0); poll(); }
  chanEl.addEventListener("change",function(){ if(wantPlay){ stop(); start(); } });
  function stop(){ wantPlay=false; teardown(); setIcon(false); setState("Stopped",""); statusEl.textContent="Source: —"; clearTimeout(npTimer); }

  btn.addEventListener("click",function(){ wantPlay?stop():start(); });
  document.addEventListener("keydown",function(e){ if(e.code==="Space" && e.target.tagName!=="INPUT"){ e.preventDefault(); btn.click(); } });
  vol.addEventListener("input",function(){ audio.volume=+vol.value; });
  audio.volume=+vol.value;
  audio.addEventListener("playing",function(){ setState("Live","playing"); });
  audio.addEventListener("waiting",function(){ if(wantPlay) setState("Buffering","buffering"); });
  audio.addEventListener("error",function(){
    if(!audio.getAttribute("src")) return;
    fail(SOURCES[idx].label+" failed (media error "+(audio.error?audio.error.code:"?")+")");
  });
  audio.addEventListener("stalled",function(){ if(wantPlay) setState("Buffering","buffering"); });

  // Now playing: best effort, tolerant of unknown response shape.
  function pick(o,keys){ for(var i=0;i<keys.length;i++){ if(o&&o[keys[i]]) return o[keys[i]]; } return ""; }
  function poll(){
    clearTimeout(npTimer);
    if(!wantPlay) return;
    (function tryUrl(n){
      if(n>=NP_URLS.length) return;
      fetch(NP_URLS[n],{cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
        var t=Array.isArray(d)?d[0]:d; if(t&&t.length===undefined&&!t.title&&d.tracks) t=d.tracks[0];
        var title=pick(t,["title","song","track"]), artist=pick(t,["artist","artist_name"]);
        if(title){ titleEl.textContent=title; artistEl.textContent=artist||"KCRW On Air"; }
      }).catch(function(){ tryUrl(n+1); });
    })(0);
    npTimer=setTimeout(poll,20000);
  }
})();
</script>
</body>
</html>
